<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
    <title id="title">Coming soon</title>
    <desc id="desc">Minimal coming soon placeholder.</desc>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0b0b0d"/>
            <stop offset="100%" stop-color="#000000"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="1200" height="720" fill="url(#bg)"/>

    <!-- Optional subtle frame (remove if you want ultra-minimal) -->
    <rect x="56" y="56" width="1088" height="608" rx="24"
          fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- Main text -->
    <text x="600" y="360"
          text-anchor="middle"
          font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="64"
          font-weight="500"
          fill="#ffffff"
          letter-spacing="0.5">
        Coming soon
    </text>

    <!-- Subtitle -->
    <text x="600" y="430"
          text-anchor="middle"
          font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="28"
          font-weight="400"
          fill="#9ca3af"
          letter-spacing="2">
        Тун удахгүй
    </text>

    <!-- Added line -->
    <text x="600" y="475"
          text-anchor="middle"
          font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="18"
          font-weight="400"
          fill="#6b7280"
          letter-spacing="3">
        PHOTOS ARRIVING SOON
    </text>
</svg>